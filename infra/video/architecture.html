<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Architecture</title>
<style>
  :root {
    --bg:#0a0a0b; --fg:#e8e8e6; --muted:#a0a09a; --faint:#6a6a64;
    --accent:#34d399; --border:#25252b; --surface:#16161a;
    --pg:#6b9fe0; --fs:#f59f5b; --ft:#5ec4c4; --gm:#b9aeff;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    width: 1920px; height: 1080px; overflow: hidden; }
  .stage { width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 64px; padding: 80px; box-sizing: border-box; }
  .kicker {
    font-family: "SF Mono", ui-monospace, monospace; font-size: 14px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint);
    opacity: 0; animation: rise 700ms cubic-bezier(.22,1,.36,1) 200ms forwards;
  }
  h1 { font-size: 64px; font-weight: 700; letter-spacing: -0.04em; margin: 0;
    line-height: 1.1; opacity: 0;
    animation: rise 700ms cubic-bezier(.22,1,.36,1) 400ms forwards;
  }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 80px;
    align-items: center; width: 1600px; position: relative; }
  .node {
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 12px; padding: 28px 24px;
    display: flex; flex-direction: column; gap: 10px;
    opacity: 0; transform: translateY(20px);
    animation: rise 600ms var(--accent) forwards;
  }
  .node h3 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; color: var(--fg); }
  .node p {
    font-size: 13px; color: var(--muted); margin: 0; line-height: 1.45;
    font-family: "SF Mono", ui-monospace, monospace;
  }
  .pip { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .node[data-key="prod"] { animation-delay: 1.0s; }
  .node[data-key="engine"] { animation-delay: 1.6s; }
  .node[data-key="agent"] { animation-delay: 2.2s; }
  .node[data-key="fivetran"] { animation-delay: 2.8s; }
  .node[data-key="bq"] { animation-delay: 3.4s; }
  .node[data-key="agent"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 40px rgba(52,211,153,.18); }

  .arrows { position: absolute; inset: 0; pointer-events: none; }
  .arrow { stroke: var(--border); stroke-width: 2; fill: none;
    stroke-dasharray: 6 6; stroke-dashoffset: 100;
    animation: dash 700ms ease-out forwards;
  }
  .arrow.a1 { animation-delay: 1.5s; }
  .arrow.a2 { animation-delay: 2.1s; }
  .arrow.a3 { animation-delay: 2.7s; }
  .arrow.a4 { animation-delay: 3.3s; }

  .data { fill: var(--accent); r: 4; opacity: 0;
    animation: flow 5s linear 4.2s infinite;
  }
  .data.d2 { animation-delay: 4.6s; }
  .data.d3 { animation-delay: 5.0s; }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes dash { to { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes flow {
    0% { opacity: 0; offset-distance: 0%; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; offset-distance: 100%; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div style="text-align:center;">
      <div class="kicker">How Synth works</div>
      <h1>One agent. Five services. Zero manual handoffs.</h1>
    </div>

    <div class="row" id="row">
      <div class="node" data-key="prod">
        <h3><span class="pip" style="background:var(--pg)"></span>Cloud SQL</h3>
        <p>prod &middot; 100k Lending Club loans</p>
      </div>
      <div class="node" data-key="engine">
        <h3><span class="pip" style="background:var(--accent)"></span>Engine</h3>
        <p>FastAPI &middot; copula + validators</p>
      </div>
      <div class="node" data-key="agent">
        <h3><span class="pip" style="background:var(--gm)"></span>Gemini 3.1 Pro</h3>
        <p>Agent Builder &middot; 9 function tools</p>
      </div>
      <div class="node" data-key="fivetran">
        <h3><span class="pip" style="background:var(--ft)"></span>Fivetran MCP</h3>
        <p>sync_connection &middot; GCS → BQ</p>
      </div>
      <div class="node" data-key="bq">
        <h3><span class="pip" style="background:var(--fs)"></span>BigQuery</h3>
        <p>staging &middot; synth_staging</p>
      </div>

      <svg class="arrows" viewBox="0 0 1600 80" preserveAspectRatio="none"
        style="top: calc(50% - 40px); height: 80px;">
        <line class="arrow a1" x1="280" y1="40" x2="376" y2="40" />
        <line class="arrow a2" x1="624" y1="40" x2="720" y2="40" />
        <line class="arrow a3" x1="968" y1="40" x2="1064" y2="40" />
        <line class="arrow a4" x1="1312" y1="40" x2="1408" y2="40" />
      </svg>
    </div>
  </div>
</body>
</html>
