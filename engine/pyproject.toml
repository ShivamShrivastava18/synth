[project]
name = "synth-engine"
version = "0.1.0"
description = "Synth engine — synthetic tabular data generation + fidelity validation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "psycopg2-binary>=2.9",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "google-cloud-firestore>=2.18",
  "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synth_engine"]
